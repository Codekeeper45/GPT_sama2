name: Deploy manga reader to GitHub Pages

on:
  push:
    branches: [manga-reader-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: manga-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reader branch
        uses: actions/checkout@v4

      - name: Download and validate manga archive
        env:
          DRIVE_ID: 1t-BU9gpK5OYdKJqAkvMeZicZ3e9O7g7r
        run: |
          set -euo pipefail
          URL="https://drive.usercontent.google.com/download?id=${DRIVE_ID}&export=download&confirm=t"
          curl -fL --connect-timeout 15 --max-time 180 --retry 2 --retry-delay 2 "$URL" -o manga.zip
          echo "Archive bytes: $(wc -c < manga.zip)"
          file manga.zip
          unzip -t manga.zip | tail -3
          rm -rf site extracted
          mkdir -p site extracted
          unzip -q manga.zip -d extracted
          SRC="extracted/manga-reader-vercel"
          test -f "$SRC/index.html"
          test -f "$SRC/pages/page-001.webp"
          test -f "$SRC/pages/page-140.webp"
          cp -R "$SRC"/. site/
          touch site/.nojekyll
          python - <<'PY'
          from pathlib import Path
          files=sorted(Path('site/pages').glob('page-*.webp'))
          assert len(files)==140, len(files)
          for f in files:
              b=f.read_bytes()
              assert len(b)>25000, (f,len(b))
              assert b[:4]==b'RIFF' and b[8:12]==b'WEBP', f
          cover=Path('site/cover.webp').read_bytes()
          assert cover[:4]==b'RIFF' and cover[8:12]==b'WEBP'
          print('Validated',len(files),'full-quality manga pages')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
